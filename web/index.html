<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AuraBudget Pro — Planificateur Financier, Ingestion TrueLayer & Audit Salarial IA">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="budget_planner_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AuraBudget Pro — Audit Salarial & Caviardage IA</title>
  <link rel="manifest" href="manifest.json">

  <!-- pdf.js library for Web PDF page rendering and Text Extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    window.renderPdfBase64WithCallback = function(base64Str, callbackName) {
      try {
        var binaryString = atob(base64Str);
        var len = binaryString.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        pdfjsLib.getDocument({ data: bytes }).promise.then(function(pdf) {
          pdf.getPage(1).then(function(page) {
            var viewport = page.getViewport({ scale: 2.0 });
            var canvas = document.createElement('canvas');
            var context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            page.render({ canvasContext: context, viewport: viewport }).promise.then(function() {
              var dataUrl = canvas.toDataURL('image/png');
              if (window[callbackName]) {
                window[callbackName](dataUrl);
              }
            }).catch(function(err) {
              console.error('PDF page render error:', err);
              if (window[callbackName]) window[callbackName]('');
            });
          }).catch(function(err) {
            console.error('PDF getPage error:', err);
            if (window[callbackName]) window[callbackName]('');
          });
        }).catch(function(err) {
          console.error('pdfjs getDocument error:', err);
          if (window[callbackName]) window[callbackName]('');
        });
      } catch (err) {
        console.error('renderPdfBase64WithCallback exception:', err);
        if (window[callbackName]) window[callbackName]('');
      }
    };

    window.extractPdfTextWithCallback = function(base64Str, callbackName) {
      try {
        var binaryString = atob(base64Str);
        var len = binaryString.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        pdfjsLib.getDocument({ data: bytes }).promise.then(function(pdf) {
          pdf.getPage(1).then(function(page) {
            page.getTextContent().then(function(textContent) {
              var extractedText = textContent.items.map(function(item) { return item.str; }).join(' ');
              if (window[callbackName]) {
                window[callbackName](extractedText);
              }
            }).catch(function(err) {
              console.error('PDF getTextContent error:', err);
              if (window[callbackName]) window[callbackName]('');
            });
          }).catch(function(err) {
            console.error('PDF getPage error:', err);
            if (window[callbackName]) window[callbackName]('');
          });
        }).catch(function(err) {
          console.error('pdfjs getDocument text error:', err);
          if (window[callbackName]) window[callbackName]('');
        });
      } catch (err) {
        console.error('extractPdfTextWithCallback exception:', err);
        if (window[callbackName]) window[callbackName]('');
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
